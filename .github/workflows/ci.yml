name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fingguard-rag-api:ci

  agent-tests:
    # Separate environment: google-adk pins opentelemetry-api<=1.42.1, which
    # conflicts with fastapi==0.142.2 in requirements.txt (see requirements-agent.txt).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-agent.txt
          pip check

      - name: Run agent tests (offline, scripted LLM, mocked retriever)
        run: python -m pytest -v tests/test_agent.py tests/test_agent_extensions.py

  conversation-tests:
    # LangGraph conversation service: offline unit tests, then integration tests
    # against real PostgreSQL (checkpoints + append-only audit log) and Redis.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finguard
          POSTGRES_PASSWORD: finguard
          POSTGRES_DB: finguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finguard"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install conversation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-conversation.txt
          pip check

      - name: Run conversation tests (unit + PostgreSQL/Redis integration)
        env:
          FINGUARD_TEST_DATABASE_URL: postgresql://finguard:finguard@localhost:5432/finguard
          FINGUARD_TEST_REDIS_URL: redis://localhost:6379/0
        run: python -m pytest -v tests/test_conversation.py tests/test_conversation_integration.py
